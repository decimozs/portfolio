name: Build resume

on:
  push:
    branches: ["main"]
    paths:
      - "resume/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  build-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v4

      - name: Install Times New Roman
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y ttf-mscorefonts-installer
          fc-cache -f

      - name: Compile resume
        run: typst compile resume/resume.typ public/resume.pdf

      - name: Open PR with updated PDF
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(resume): rebuild resume.pdf from resume/data.yaml"
          title: "chore(resume): rebuild resume.pdf"
          body: Auto-generated from the latest `resume/data.yaml` after a push to `main`.
          branch: bot/resume-rebuild
          delete-branch: true
          add-paths: public/resume.pdf
